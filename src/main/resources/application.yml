server:
  port: 10001
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring:
  application:
    name: wedding-letter
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
            scope: profile,email
          kakao:
            client-id: ${OAUTH_KAKAO_CLIENT_ID:}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI:https://vowory.com/login/oauth2/code/kakao}
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
    access-token-validity-seconds: ${APP_JWT_ACCESS_TOKEN_VALIDITY_SECONDS:604800}
    cookie-domain: ${APP_JWT_COOKIE_DOMAIN:}
  oauth2:
    success-redirect-uri: ${APP_OAUTH2_SUCCESS_REDIRECT_URI:https://vowory.com/}
  frontend:
    origin: ${APP_FRONTEND_ORIGIN:https://vowory.com}
  admin:
    user-ids: ${APP_ADMIN_USER_IDS:}
  watermark:
    text: ${APP_WATERMARK_TEXT:Wedding Letter}
  storage:
    type: ${APP_STORAGE_TYPE:s3}
    path-prefix: ${APP_STORAGE_PATH_PREFIX:wedding}
    local-base-path: ${APP_STORAGE_LOCAL_BASE_PATH:uploads}
    local-public-prefix: ${APP_STORAGE_LOCAL_PUBLIC_PREFIX:/uploads}
    s3:
      bucket: ${APP_STORAGE_S3_BUCKET:s3}
      region: ${APP_STORAGE_S3_REGION:auto}
      endpoint: ${APP_STORAGE_S3_ENDPOINT:https://0f4693c11b7338d887edd1da17a9014f.r2.cloudflarestorage.com}
      prefix: ${APP_STORAGE_S3_PREFIX:}
      public-base-url: ${APP_STORAGE_S3_PUBLIC_BASE_URL:https://pub-fe2fd31f061a47f8a6a8515292365999.r2.dev}
      access-key-id: ${APP_STORAGE_S3_ACCESS_KEY_ID:${AWS_ACCESS_KEY_ID:}}
      secret-access-key: ${APP_STORAGE_S3_SECRET_ACCESS_KEY:${AWS_SECRET_ACCESS_KEY:}}
      session-token: ${APP_STORAGE_S3_SESSION_TOKEN:${AWS_SESSION_TOKEN:}}
  upload:
    image-max-bytes: ${APP_UPLOAD_IMAGE_MAX_BYTES:10485760}
    audio-max-bytes: ${APP_UPLOAD_AUDIO_MAX_BYTES:20971520}
    allowed-image-content-types:
      - image/jpeg
      - image/png
      - image/webp
    allowed-audio-content-types:
      - audio/mpeg
      - audio/mp3
      - audio/wav
      - audio/x-wav
      - audio/mp4
      - audio/x-m4a
      - audio/ogg
  mail:
    enabled: true
    error-to: ${APP_MAIL_ERROR_TO:}
    from: ${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
    error-stack-trace-line-limit: 12

third-party:
  kakao:
    js: ${KAKAO_JS:}

logging:
  file:
    name: ${APP_LOG_FILE:../logs/wedding-letter.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${APP_LOG_ROLLING_PATTERN:./logs/wedding-letter.%d{yyyy-MM-dd}.%i.log.gz}
      max-file-size: ${APP_LOG_MAX_FILE_SIZE:10MB}
      max-history: ${APP_LOG_MAX_HISTORY:30}
      total-size-cap: ${APP_LOG_TOTAL_SIZE_CAP:1GB}
  level:
    org.springframework.web: INFO
    com.gh.wedding: DEBUG
